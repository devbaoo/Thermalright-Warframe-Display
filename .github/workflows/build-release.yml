name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows Resources & Syso
        run: |
          go-winres simply --icon assets/app_icon.png --manifest gui --file-description "Thermalright Frozen Warframe Display" --product-name "Thermalright Warframe"

      - name: Build Standalone Binary
        run: |
          go build -ldflags="-H=windowsgui -s -w" -o ThermalrightWarframe.exe main.go

      - name: Create Release Package
        run: |
          $pkg = "Thermalright-Warframe-Display-${{ github.ref_name }}-windows-amd64"
          New-Item -ItemType Directory -Path "$pkg\assets\presets" -Force
          Copy-Item "ThermalrightWarframe.exe" "$pkg\" -Force
          Copy-Item "pkg\usb\libusb-1.0.dll" "$pkg\" -Force
          Copy-Item "assets\sample_core.gif" "$pkg\assets\" -Force
          Copy-Item "assets\app_icon.ico" "$pkg\assets\" -Force
          Copy-Item "assets\app_icon.png" "$pkg\assets\" -Force
          Copy-Item "assets\presets\*" "$pkg\assets\presets\" -Recurse -Force
          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip" -CompressionLevel Optimal

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ThermalrightWarframe.exe
            Thermalright-Warframe-Display-${{ github.ref_name }}-windows-amd64.zip
